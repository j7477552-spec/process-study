<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>반도체 8대 공정 & L02 포토 심화 스터디랩</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #111a2e;
      --card-bg: #1a263e;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --accent-cyan: #22d3ee;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26354d;
      --tag-bg: rgba(56, 189, 248, 0.12);
      --sidebar-width: 360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-white);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 좌측 계층형 메뉴 (토글 지원) */
    aside {
      width: var(--sidebar-width);
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    aside.collapsed {
      margin-left: calc(-1 * var(--sidebar-width));
    }
    .brand {
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tree-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .acc-header {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: all 0.2s;
    }
    .acc-header:hover { background: rgba(255, 255, 255, 0.08); }
    .acc-header.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .acc-content {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding-left: 8px;
      margin-top: 4px;
      border-left: 2px solid var(--border-color);
      margin-left: 8px;
    }
    .acc-content.open { display: flex; }

    .sub-acc-header {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      margin-top: 2px;
    }
    .sub-acc-header:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .sub-acc-header.active { color: var(--accent-cyan); font-weight: 700; }
    
    .sub-acc-content {
      display: none;
      flex-direction: column;
      gap: 3px;
      padding-left: 10px;
      border-left: 1px dashed var(--border-color);
      margin-left: 8px;
      margin-bottom: 4px;
    }
    .sub-acc-content.open { display: flex; }

    .item-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .item-btn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .item-btn.active {
      background: var(--accent-blue);
      color: #090d16;
      font-weight: 700;
    }

    /* 메인 뷰 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--bg-dark);
      width: 100%;
      transition: all 0.3s ease;
    }
    header {
      padding: 14px 24px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sidebar-toggle-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .sidebar-toggle-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }
    .header-info h1 { font-size: 1.25rem; font-weight: 700; }
    .header-info p { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

    .content-grid {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 22px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 시뮬레이터 박스 */
    .sim-box {
      background: #040711;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }
    canvas {
      width: 100%;
      height: 280px;
      background: #02040a;
      border-radius: 6px;
      touch-action: none;
    }
    .timeline-slider {
      width: 100%;
      cursor: pointer;
      accent-color: var(--accent-blue);
      margin-top: 14px;
      height: 24px;
    }

    /* SVG 도해 컨테이너 */
    .diagram-container {
      background: #060b17;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 16px 0;
      overflow-x: auto;
    }
    .diagram-container svg {
      max-width: 100%;
      height: auto;
    }
    .diagram-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent-blue); color: #090d16; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--card-bg); color: #fff; border: 1px solid var(--border-color); }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #94a3b8;
    }
    .btn-toggle.active {
      background: var(--accent-cyan);
      color: #090d16;
      font-weight: 700;
      border-color: var(--accent-cyan);
    }

    /* 이론 본문 */
    .theory-box {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      line-height: 1.75;
      font-size: 0.94rem;
      color: #cbd5e1;
    }
    .theory-section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .theory-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .theory-section h3 {
      font-size: 1rem;
      color: var(--accent-blue);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theory-section ul {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .theory-section strong { color: #fff; }
    .code-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .param-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .param-card {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 14px;
      border-radius: 6px;
      border-left: 3px solid var(--accent-blue);
      font-size: 0.88rem;
    }
    .param-card b { color: #fff; display: block; margin-bottom: 3px; }

    .quiz-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 16px;
      margin-top: 18px;
    }
    .quiz-ans { display: none; margin-top: 10px; font-weight: 600; color: #38bdf8; line-height: 1.5; }

    textarea.notes-area {
      width: 100%;
      height: 180px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    textarea.notes-area:focus { border-color: var(--accent-blue); }
    .save-alert { font-size: 0.82rem; color: #10b981; margin-top: 6px; display: none; }

    @media (max-width: 768px) {
      aside {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
      }
      canvas { height: 210px; }
    }
  </style>
</head>
<body>

  <!-- 좌측 사이드바 -->
  <aside id="mainSidebar">
    <div class="brand">🔬 반도체 8대 공정 & L02 포토 심화</div>
    <div class="tree-nav" id="accordionNav"></div>
  </aside>

  <!-- 메인 작업창 -->
  <main>
    <header>
      <div class="header-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="사이드바 메뉴 열기/닫기">
          <span id="toggleIcon">☰</span>
          <span id="toggleText">메뉴 닫기</span>
        </button>
        <div class="header-info">
          <h1 id="viewHeaderTitle">공정을 선택해 주세요</h1>
          <p id="viewHeaderPath">분류 > 공정명</p>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveCurrentNote()">💾 지식 노트 저장</button>
    </header>

    <div class="content-grid">
      <!-- 1. [CMOS 시뮬레이터 카드] -->
      <div class="card" id="cmosCard" style="display:none;">
        <div class="card-title">🖥️ CMOS 전공정 연속 단면 시뮬레이션 (Twin-Well to Metal-1)</div>
        <div class="sim-box">
          <canvas id="cmosCanvas" width="900" height="280"></canvas>
          <div style="width:100%; margin-top:10px;">
            <input type="range" id="cmosSlider" class="timeline-slider" min="0" max="1000" value="0" oninput="onCmosSlider(this.value)" />
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
              <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" id="cmosPlayBtn" onclick="toggleCmosPlay()">▶ 전체 공정 연속 재생</button>
                <button class="btn btn-secondary" onclick="resetCmos()">⏮ 처음으로</button>
              </div>
              <div id="cmosStageBadge" style="font-size:0.86rem; color:var(--accent-blue); font-weight:600;">대기 중</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. [멀티패터닝: LELE & SADP 시뮬레이터 카드 (멀티 패터닝 메뉴 선택 시 활성화)] -->
      <div class="card" id="mptCard" style="display:none;">
        <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>🖥️ 멀티패터닝(MPT) 공정 연속 단면 시뮬레이터</span>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-toggle active" id="btnToggleLele" onclick="switchMptMode('LELE')">🎞️️ LELE 시뮬레이션</button>
            <button class="btn btn-toggle" id="btnToggleSadp" onclick="switchMptMode('SADP')">🎞️ SADP 시뮬레이션</button>
          </div>
        </div>
        <div class="sim-box">
          <canvas id="mptCanvas" width="900" height="280"></canvas>
          <div style="width:100%; margin-top:10px;">
            <input type="range" id="mptSlider" class="timeline-slider" min="0" max="1000" value="0" oninput="onMptSlider(this.value)" />
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
              <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" id="mptPlayBtn" onclick="toggleMptPlay()">▶ 전체 시퀀스 연속 재생</button>
                <button class="btn btn-secondary" onclick="resetMpt()">⏮ 처음으로</button>
              </div>
              <div id="mptStageBadge" style="font-size:0.86rem; color:var(--accent-cyan); font-weight:600;">대기 중</div>
            </div>
          </div>
        </div>
        <div id="mptStepExplanation" style="margin-top:12px; font-size:0.88rem; color:#cbd5e1; background:#111a2e; padding:12px; border-radius:8px; border-left:3px solid var(--accent-cyan); line-height:1.6;"></div>
      </div>

      <!-- 3. 교재 심화 이론 & 도해 분석 카드 -->
      <div class="card">
        <div class="card-title" id="theoryCardTitle">📖 교재 심화 이론 & 메커니즘 분석</div>
        <div class="theory-box">
          <div id="theoryMainDesc">내용을 불러오는 중입니다...</div>
          
          <div class="diagram-container" id="diagramWrapper">
            <div id="diagramSvgArea"></div>
            <div class="diagram-caption" id="diagramCaptionText"></div>
          </div>

          <div class="param-list" id="paramListContainer"></div>

          <div class="quiz-box" id="quizContainer">
            <p id="quizQuestion" style="font-weight:600;">Q. 질문</p>
            <button class="btn btn-secondary" style="margin-top:8px;" onclick="toggleQuizAnswer()">💡 모범 답안 확인</button>
            <div id="quizAnswer" class="quiz-ans">정답</div>
          </div>
        </div>
      </div>

      <!-- 4. 필기 노트 -->
      <div class="card">
        <div class="card-title">📝 나만의 공정 족보 노트 (iPad 로컬 자동저장)</div>
        <textarea id="studyNote" class="notes-area" placeholder="애플펜슬 또는 키보드로 핵심 내용과 시험 족보를 정리해보세요..."></textarea>
        <div id="saveAlert" class="save-alert">✓ 아이패드 브라우저(LocalStorage)에 저장되었습니다.</div>
      </div>
    </div>
  </main>

  <script>
    // =========================================================================
    // 사이드바 토글 (열기/닫기) 로직
    // =========================================================================
    function toggleSidebar() {
      const sidebar = document.getElementById("mainSidebar");
      const toggleText = document.getElementById("toggleText");
      const isCollapsed = sidebar.classList.toggle("collapsed");
      toggleText.innerText = isCollapsed ? "메뉴 열기" : "메뉴 닫기";
    }

    // =========================================================================
    // SVG 벡터 도해 모음 (모든 도해 원본 100% 보존)
    // =========================================================================
    const SVG_DIAGRAMS = {
      photo_sequence: `
        <svg viewBox="0 0 780 140" width="750">
          <g font-size="11" font-weight="bold" text-anchor="middle">
            <rect x="10" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <text x="50" y="60" fill="#38bdf8">1. Surface</text><text x="50" y="75" fill="#94a3b8">(HMDS)</text>
            <path d="M95 62 L110 62" stroke="#64748b" stroke-width="2"/>

            <rect x="115" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <text x="155" y="60" fill="#38bdf8">2. Spin</text><text x="155" y="75" fill="#94a3b8">Coat (EBR)</text>
            <path d="M200 62 L215 62" stroke="#64748b" stroke-width="2"/>

            <rect x="220" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <text x="260" y="60" fill="#f59e0b">3. Soft</text><text x="260" y="75" fill="#94a3b8">Bake</text>
            <path d="M305 62 L320 62" stroke="#64748b" stroke-width="2"/>

            <rect x="325" y="40" width="85" height="45" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
            <text x="367" y="60" fill="#ef4444">4. Align &</text><text x="367" y="75" fill="#ef4444">Exposure</text>
            <path d="M415 62 L430 62" stroke="#64748b" stroke-width="2"/>

            <rect x="435" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <text x="475" y="60" fill="#f59e0b">5. PEB</text><text x="475" y="75" fill="#94a3b8">(Bake)</text>
            <path d="M520 62 L535 62" stroke="#64748b" stroke-width="2"/>

            <rect x="540" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
            <text x="580" y="60" fill="#22c55e">6. Develop</text><text x="580" y="75" fill="#94a3b8">(TMAH)</text>
            <path d="M625 62 L640 62" stroke="#64748b" stroke-width="2"/>

            <rect x="645" y="40" width="80" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <text x="685" y="60" fill="#f59e0b">7. Hard</text><text x="685" y="75" fill="#94a3b8">Bake</text>
            <path d="M730 62 L745 62" stroke="#64748b" stroke-width="2"/>

            <circle cx="760" cy="62" r="14" fill="#38bdf8"/>
            <text x="760" y="66" fill="#090d16">Etch</text>
          </g>
        </svg>
      `,
      hmds_reaction: `
        <svg viewBox="0 0 600 160" width="560">
          <rect x="40" y="100" width="220" height="40" fill="#64748b"/>
          <path d="M90 100 Q150 50 210 100 Z" fill="rgba(56,189,248,0.5)" stroke="#38bdf8" stroke-width="2"/>
          <text x="150" y="125" fill="#fff" font-size="11" text-anchor="middle">친수성 Si 표면 (Si-OH)</text>
          <text x="150" y="75" fill="#38bdf8" font-size="11" text-anchor="middle">낮은 접촉각 (PR 밀착 불량)</text>

          <path d="M280 90 L320 90" stroke="#f59e0b" stroke-width="3"/>
          <text x="300" y="78" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">HMDS 증기 치환</text>

          <rect x="340" y="100" width="220" height="40" fill="#64748b"/>
          <circle cx="450" cy="75" r="25" fill="rgba(56,189,248,0.7)" stroke="#38bdf8" stroke-width="2"/>
          <text x="450" y="125" fill="#fff" font-size="11" text-anchor="middle">소수성 Si (-O-Si(CH3)3)</text>
          <text x="450" y="78" fill="#fff" font-size="11" text-anchor="middle">높은 접촉각 (PR 결합력 극대화)</text>
        </svg>
      `,
      rayleigh_dof: `
        <svg viewBox="0 0 600 180" width="560">
          <ellipse cx="140" cy="30" rx="70" ry="12" fill="#38bdf8" opacity="0.6"/>
          <line x1="70" y1="30" x2="140" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="210" y1="30" x2="140" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="140" y1="30" x2="140" y2="120" stroke="#f59e0b" stroke-dasharray="3,3"/>
          <rect x="110" y="115" width="60" height="10" fill="rgba(244,63,94,0.7)"/>
          <text x="140" y="145" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Large NA → High Res (미세선폭 R↓)</text>

    // =========================================================================
    // 아코디언 메뉴 렌더링
    // =========================================================================
    function buildTree() {
      const container = document.getElementById("accordionNav");
      container.innerHTML = "";

      fabStructure.forEach((sec) => {
        const secHeader = document.createElement("div");
        secHeader.className = "acc-header" + (sec.isOpen ? " active" : "");
        secHeader.innerHTML = `<span>${sec.name}</span><span>${sec.isOpen ? '▾' : '▸'}</span>`;
        secHeader.onclick = () => {
          sec.isOpen = !sec.isOpen;
          buildTree();
        };
        container.appendChild(secHeader);

        const secContent = document.createElement("div");
        secContent.className = "acc-content" + (sec.isOpen ? " open" : "");

        sec.subCategories.forEach((sub) => {
          const isSubOpen = sub.isOpen !== undefined ? sub.isOpen : true;
          const subHeader = document.createElement("button");
          subHeader.className = "sub-acc-header" + (isSubOpen ? " active" : "");
          subHeader.innerHTML = `<span>▸ ${sub.title}</span><span style="font-size:10px;">${isSubOpen ? '▾' : '▸'}</span>`;
          subHeader.onclick = (e) => {
            e.stopPropagation();
            sub.isOpen = !isSubOpen;
            buildTree();
          };
          secContent.appendChild(subHeader);

          const subContent = document.createElement("div");
          subContent.className = "sub-acc-content" + (isSubOpen ? " open" : "");

          sub.items.forEach(it => {
            const btn = document.createElement("button");
            btn.className = "item-btn";
            btn.id = "btn-" + it.id;
            btn.innerText = it.name;
            btn.onclick = () => selectNode(it, sub.title, sec.name);
            subContent.appendChild(btn);
          });

          secContent.appendChild(subContent);
        });

        container.appendChild(secContent);
      });

      if (!currentItem) {
        selectNode(fabStructure[0].subCategories[2].items[5], fabStructure[0].subCategories[2].title, fabStructure[0].name);
      }
    }

    function selectNode(item, subTitle, sectionName) {
      currentItem = item;
      document.querySelectorAll(".item-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("btn-" + item.id);
      if (btn) btn.classList.add("active");

      document.getElementById("viewHeaderTitle").innerText = item.name;
      document.getElementById("viewHeaderPath").innerText = `${sectionName} > ${subTitle}`;

      document.getElementById("theoryMainDesc").innerHTML = item.descHtml || `<p>${item.desc}</p>`;

      const svgArea = document.getElementById("diagramSvgArea");
      const captionArea = document.getElementById("diagramCaptionText");
      if (item.diagramKey && SVG_DIAGRAMS[item.diagramKey]) {
        svgArea.innerHTML = SVG_DIAGRAMS[item.diagramKey];
        captionArea.innerText = item.caption || "";
        document.getElementById("diagramWrapper").style.display = "flex";
      } else {
        document.getElementById("diagramWrapper").style.display = "none";
      }

      const paramContainer = document.getElementById("paramListContainer");
      paramContainer.innerHTML = item.params.map(p => `
        <div class="param-card">
          <b>${p.k}</b>
          <span>${p.v}</span>
        </div>
      `).join("");

      document.getElementById("quizQuestion").innerText = "Q. " + item.quiz.q;
      document.getElementById("quizAnswer").innerText = "💡 정답: " + item.quiz.a;
      document.getElementById("quizAnswer").style.display = "none";

      const savedNote = localStorage.getItem(`note_${item.id}`);
      document.getElementById("studyNote").value = savedNote !== null ? savedNote : (item.note || "");

      const cmosCard = document.getElementById("cmosCard");
      const mptCard = document.getElementById("mptCard");

      if (item.isCmos) {
        cmosCard.style.display = "block";
        mptCard.style.display = "none";
        document.getElementById("theoryCardTitle").innerText = "📖 CMOS 제조 단계별 핵심 메커니즘 분석";
        pauseCmos();
        renderCmos(cmosProgress);
      } else if (item.isMpt) {
        cmosCard.style.display = "none";
        mptCard.style.display = "block";
        document.getElementById("theoryCardTitle").innerText = "📖 멀티패터닝(LELE vs SADP) 심화 이론 분석";
        pauseMpt();
        switchMptMode(currentMptType);
      } else {
        cmosCard.style.display = "none";
        mptCard.style.display = "none";
        document.getElementById("theoryCardTitle").innerText = "📖 교재 심화 이론 & 메커니즘 분석";
      }
    }

    function toggleQuizAnswer() {
      const el = document.getElementById("quizAnswer");
      el.style.display = el.style.display === "block" ? "none" : "block";
    }

    function saveCurrentNote() {
      if (!currentItem) return;

      setTimeout(() => alertEl.style.display = "none", 2000);

    let mptAnimId = null;

    const leleSteps = [
      { range: [0.0, 0.20], title: "1단계: Hardmask 1 & 2 증착", desc: "타깃 기판(Substrate) 위에 Hardmask 2와 Hardmask 1 박막을 차례로 증착합니다." },
      { range: [0.20, 0.45], title: "2단계: 1차 Litho (Pitch a) & Etch Hardmask 1", desc: "피치 a 간격으로 1차 감광액(PR 1) 노광 후, Hardmask 1을 수직 식각하고 PR 1을 제거합니다. (하부 Hardmask 2 표면 노출)" },
      { range: [0.45, 0.75], title: "3단계: 2차 Litho (Pitch a) & Etch Hardmask 2", desc: "Hardmask 2 표면에 2차 감광액(PR 2)을 정렬 노광하여 안착시킨 뒤, Hardmask 2를 수직 식각하고 PR 2를 제거합니다." },
      { range: [0.75, 1.00], title: "4단계: Remove Hardmasks & 최종 패턴 완성 (Pitch a/2)", desc: "Hardmask 패턴을 마스크 삼아 기판을 식각한 뒤, Hardmask 1과 2를 100% 완전 제거(Strip)하여 피치 a/2의 기판 패턴만 완성합니다." }
    ];

    const sadpSteps = [
      { range: [0.0, 0.18], title: "1단계: Mandrel 증착 & Print litho pattern", desc: "타깃 기판 위에 희생층(Mandrel)을 증착하고, 넓은 피치 간격으로 1차 PR 패턴을 형성합니다." },
      { range: [0.18, 0.38], title: "2단계: Etch mandrel & PR 제거", desc: "PR을 마스크 삼아 희생층을 식각하여 Mandrel 기둥 패턴을 완성한 뒤 PR을 제거합니다." },
      { range: [0.38, 0.60], title: "3단계: Deposit and etch spacer", desc: "스페이서(산화막/질화막)를 컨포멀하게 전면 증착한 후, 수직 에치백으로 Mandrel 측벽에만 스페이서를 남깁니다." },
      { range: [0.60, 0.80], title: "4단계: Remove mandrel", desc: "선택적 습식 식각으로 중앙의 Mandrel 희생 패턴만 제거하여, 기판 위에 독립된 스페이서 쌍만 남깁니다." },
      { range: [0.80, 1.00], title: "5단계: Etch final pattern & 스페이서 제거", desc: "스페이서를 마스크로 하부 타깃 기판을 식각하고 스페이서를 제거하여, 2차 노광 없이 오버레이 오차가 0인 최종 고밀도 패턴을 완성합니다." }
    ];

    function switchMptMode(mode) {
      currentMptType = mode;
      document.getElementById("btnToggleLele").classList.toggle("active", mode === "LELE");
      document.getElementById("btnToggleSadp").classList.toggle("active", mode === "SADP");
      resetMpt();
    }

    function onMptSlider(val) {
      pauseMpt();
      mptProgress = val / 1000;
      renderMpt(mptProgress);
    }

    function toggleMptPlay() {
      if (isMptPlaying) {
        pauseMpt();
      } else {
        if (mptProgress >= 1.0) mptProgress = 0.0;
        playMpt();
      }
    }

    function playMpt() {
      isMptPlaying = true;
      document.getElementById("mptPlayBtn").innerText = "⏸ 일시 정지";
      let lastTime = performance.now();

      function step(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        mptProgress += dt * 0.08;
        if (mptProgress > 1.0) {
          mptProgress = 1.0;
          pauseMpt();
        }
        document.getElementById("mptSlider").value = Math.floor(mptProgress * 1000);
        renderMpt(mptProgress);

        if (isMptPlaying && mptProgress < 1.0) {
          mptAnimId = requestAnimationFrame(step);
        }
      }
      mptAnimId = requestAnimationFrame(step);
    }

    function pauseMpt() {
      isMptPlaying = false;
      document.getElementById("mptPlayBtn").innerText = "▶ 전체 시퀀스 연속 재생";
      if (mptAnimId) cancelAnimationFrame(mptAnimId);
    }

    function resetMpt() {
      pauseMpt();
      mptProgress = 0.0;
      document.getElementById("mptSlider").value = 0;
      renderMpt(0.0);
    }

    function renderMpt(p) {
      mptCtx.clearRect(0, 0, mptCanvas.width, mptCanvas.height);
      const w = mptCanvas.width;
      const h = mptCanvas.height;

      if (currentMptType === "LELE") {
        renderLele(p, w, h);
      } else {
        renderSadp(p, w, h);
      }
    }

    function renderLele(p, w, h) {
      const steps = leleSteps;
      let curStep = steps[0];
      for (let s of steps) {
        if (p >= s.range[0] && p <= s.range[1]) { curStep = s; break; }
        if (p > 0.75) curStep = steps[steps.length - 1];
      }

      document.getElementById("mptStageBadge").innerText = `[${(p * 100).toFixed(0)}%] ${curStep.title}`;
      document.getElementById("mptStepExplanation").innerHTML = `<b>[LELE 공정 설명]</b> ${curStep.desc}`;

      mptCtx.fillStyle = "#334155";
      mptCtx.fillRect(60, 160, w - 120, 80);
      mptCtx.fillStyle = "#fff";
      mptCtx.font = "bold 12px sans-serif";
      mptCtx.fillText("Target Substrate (하부 기판)", 70, 220);

      const xCoords1 = [120, 280, 440, 600, 760];
      const xCoords2 = [200, 360, 520, 680];
      const allX = [120, 200, 280, 360, 440, 520, 600, 680, 760];

      if (p < 0.20) {
        mptCtx.fillStyle = "#8b5cf6";
        mptCtx.fillRect(60, 135, w - 120, 25);
        mptCtx.fillStyle = "#10b981";
        mptCtx.fillRect(60, 110, w - 120, 25);
        mptCtx.fillStyle = "#fff";
        mptCtx.font = "11px sans-serif";
        mptCtx.fillText("Hardmask 2", w - 140, 152);
        mptCtx.fillText("Hardmask 1", w - 140, 127);
      }

      const p1 = getRangeP(p, 0.20, 0.45);
      if (p >= 0.20 && p < 0.45) {
        mptCtx.fillStyle = "#8b5cf6";
        mptCtx.fillRect(60, 135, w - 120, 25);

        const etchH1 = 25 * p1;
        mptCtx.fillStyle = "#10b981";
        mptCtx.fillRect(60, 110 + etchH1, w - 120, 25 - etchH1);
        xCoords1.forEach(x => mptCtx.fillRect(x, 110, 45, 25));

        const pr1Alpha = p1 < 0.8 ? 1 : (1 - (p1 - 0.8) * 5);
        mptCtx.fillStyle = `rgba(245, 158, 11, ${pr1Alpha})`;
        xCoords1.forEach(x => {
          mptCtx.fillRect(x, 70, 45, 40);
          if (pr1Alpha > 0.5) {
            mptCtx.fillStyle = "#090d16";
            mptCtx.fillText("PR 1", x + 10, 94);
            mptCtx.fillStyle = `rgba(245, 158, 11, ${pr1Alpha})`;
          }
        });

        mptCtx.strokeStyle = "#38bdf8";
        mptCtx.lineWidth = 1.5;
        mptCtx.beginPath();
        mptCtx.moveTo(120, 50); mptCtx.lineTo(280, 50);
        mptCtx.stroke();
        mptCtx.fillStyle = "#38bdf8";
        mptCtx.fillText("Pitch a", 185, 45);
      }

      const p2 = getRangeP(p, 0.45, 0.75);
      if (p >= 0.45 && p < 0.75) {
        mptCtx.fillStyle = "#10b981";
        xCoords1.forEach(x => mptCtx.fillRect(x, 110, 45, 25));

        const etchH2 = 25 * p2;
        mptCtx.fillStyle = "#8b5cf6";
        mptCtx.fillRect(60, 135, w - 120, 25);
        if (p2 > 0) {
          mptCtx.fillStyle = "#02040a";
          for (let i = 0; i < allX.length; i++) {
            const startX = i === 0 ? 60 : allX[i-1] + 45;
            const openW = allX[i] - startX;
            if (openW > 0) mptCtx.fillRect(startX, 135, openW, etchH2);
          }
        }

        // PR 2를 Hardmask 2 표면(y: 135)에 밀착
        const pr2Alpha = p2 < 0.8 ? 1 : (1 - (p2 - 0.8) * 5);
        mptCtx.fillStyle = `rgba(56, 189, 248, ${pr2Alpha})`;
        xCoords2.forEach(x => {
          mptCtx.fillRect(x, 95, 45, 40);
          if (pr2Alpha > 0.5) {
            mptCtx.fillStyle = "#090d16";
            mptCtx.fillText("PR 2", x + 10, 120);
            mptCtx.fillStyle = `rgba(56, 189, 248, ${pr2Alpha})`;
          }
        });

        mptCtx.fillStyle = "#fff";
        mptCtx.fillText("Hardmask 2 표면에 PR 2 정렬 노광 & 식각", 70, 35);
      }

      if (p >= 0.75) {
        const p3 = getRangeP(p, 0.75, 1.00);
        const subEtchH = 45 * p3;

        mptCtx.fillStyle = "#02040a";
        for (let i = 0; i < allX.length; i++) {
          const startX = i === 0 ? 60 : allX[i-1] + 45;
          const openW = allX[i] - startX;
          if (openW > 0) mptCtx.fillRect(startX, 160, openW, subEtchH);
        }

        // Hardmask 1, 2 완전 스트립 소멸
        const maskAlpha = Math.max(0, 1 - p3 * 1.5);
        if (maskAlpha > 0) {
          mptCtx.fillStyle = `rgba(16, 185, 129, ${maskAlpha})`;
          xCoords1.forEach(x => mptCtx.fillRect(x, 110, 45, 25));
          mptCtx.fillStyle = `rgba(139, 92, 246, ${maskAlpha})`;
          allX.forEach(x => mptCtx.fillRect(x, 135, 45, 25));
        }

        if (p3 > 0.7) {
          mptCtx.fillStyle = "#22c55e";
          mptCtx.font = "bold 13px sans-serif";
          mptCtx.fillText("✓ Hardmask 1, 2 완전 제거 완료! 기판 자체의 피치 a/2 최종 패턴 획득", 70, 75);

          mptCtx.strokeStyle = "#f43f5e";
          mptCtx.lineWidth = 2;
          mptCtx.beginPath();
          mptCtx.moveTo(120, 140); mptCtx.lineTo(200, 140);
          mptCtx.stroke();
          mptCtx.fillStyle = "#f43f5e";
          mptCtx.fillText("Pitch a/2 (선폭 2배 조밀)", 125, 132);
        }
      }
    }

    function renderSadp(p, w, h) {
      const steps = sadpSteps;
      let curStep = steps[0];
      for (let s of steps) {
        if (p >= s.range[0] && p <= s.range[1]) { curStep = s; break; }
        if (p > 0.80) curStep = steps[steps.length - 1];
      }

      document.getElementById("mptStageBadge").innerText = `[${(p * 100).toFixed(0)}%] ${curStep.title}`;
      document.getElementById("mptStepExplanation").innerHTML = `<b>[SADP 공정 설명]</b> ${curStep.desc}`;

      mptCtx.fillStyle = "#334155";
      mptCtx.fillRect(60, 160, w - 120, 80);
      mptCtx.fillStyle = "#fff";
      mptCtx.font = "bold 12px sans-serif";
      mptCtx.fillText("Target Substrate (하부 기판)", 70, 220);

      const mX = [140, 380, 620];
      const mW = 90;

      if (p < 0.18) {
        mptCtx.fillStyle = "#64748b";
        mptCtx.fillRect(60, 120, w - 120, 40);
        mptCtx.fillStyle = "#fff";
        mptCtx.fillText("Mandrel 희생막", w - 160, 145);

        mptCtx.fillStyle = "#f59e0b";
        mX.forEach(x => {
          mptCtx.fillRect(x, 80, mW, 40);
          mptCtx.fillStyle = "#090d16";
          mptCtx.fillText("PR", x + 35, 105);
          mptCtx.fillStyle = "#f59e0b";
        });
      }

      if (p >= 0.18 && p < 0.38) {
        mptCtx.fillStyle = "#64748b";
        mX.forEach(x => {
          mptCtx.fillRect(x, 120, mW, 40);
          mptCtx.fillStyle = "#fff";
          mptCtx.fillText("Mandrel", x + 20, 145);
          mptCtx.fillStyle = "#64748b";
        });
      }

      const p3 = getRangeP(p, 0.38, 0.60);
      const spW = 24;
      if (p >= 0.38 && p < 0.60) {
        mptCtx.fillStyle = "#64748b";
        mX.forEach(x => mptCtx.fillRect(x, 120, mW, 40));

        const spH = 40 * p3;
        mptCtx.fillStyle = "#38bdf8";
        mX.forEach(x => {
          mptCtx.fillRect(x - spW, 160 - spH, spW, spH);
          mptCtx.fillRect(x + mW, 160 - spH, spW, spH);
        });
        mptCtx.fillStyle = "#fff";
        mptCtx.fillText("Spacer 증착 & 에치백", 70, 100);
      }

      const p4 = getRangeP(p, 0.60, 0.80);
      if (p >= 0.60 && p < 0.80) {
        const mAlpha = 1 - p4;
        mptCtx.fillStyle = `rgba(100, 116, 139, ${mAlpha})`;
        mX.forEach(x => mptCtx.fillRect(x, 120, mW, 40));

        mptCtx.fillStyle = "#38bdf8";
        mX.forEach(x => {
          mptCtx.fillRect(x - spW, 120, spW, 40);
          mptCtx.fillRect(x + mW, 120, spW, 40);
        });
        mptCtx.fillStyle = "#f59e0b";
        mptCtx.fillText("Mandrel 선택적 제거 완료 (스페이서만 마스크로 잔존)", 70, 95);
      }

      if (p >= 0.80) {
        const p5 = getRangeP(p, 0.80, 1.00);
        const subEtchH = 40 * p5;

        const spAlpha = Math.max(0, 1 - p5 * 1.5);
        if (spAlpha > 0) {
          mptCtx.fillStyle = `rgba(56, 189, 248, ${spAlpha})`;
          mX.forEach(x => {
            mptCtx.fillRect(x - spW, 120, spW, 40);
            mptCtx.fillRect(x + mW, 120, spW, 40);
          });
        }

        mptCtx.fillStyle = "#02040a";
        mX.forEach(x => {
          mptCtx.fillRect(x, 160, mW, subEtchH);
          mptCtx.fillRect(x + mW + spW, 160, (380 - (140 + mW + spW) - spW), subEtchH);
        });

        if (p5 > 0.6) {
          mptCtx.fillStyle = "#22c55e";
          mptCtx.font = "bold 13px sans-serif";
          mptCtx.fillText("✓ 2차 노광 없는 피치 1/2 자기정렬 최종 패턴 완성", 70, 95);
        }
      }
    }

    function getRangeP(val, min, max) {
      if (val < min) return 0;
      if (val > max) return 1;
      return (val - min) / (max - min);
    }

    // =========================================================================
    // CMOS 9단계 시뮬레이터 엔진 (100% 보존)
    // =========================================================================
    const cmosCanvas = document.getElementById("cmosCanvas");
    const cmosCtx = cmosCanvas.getContext("2d");
    let cmosProgress = 0.0;
    let isCmosPlaying = false;
    let cmosAnimId = null;

    const cmosStages = [
      { range: [0.0, 0.12], title: "1. Twin-Well 형성 (N-Well & P-Well)" },
      { range: [0.12, 0.24], title: "2. STI 소자 격리 트렌치 매립 & CMP" },
      { range: [0.24, 0.38], title: "3. Gate Oxide & Poly-Si 게이트 패터닝" },
      { range: [0.38, 0.50], title: "4. LDD (Lightly Doped Drain) 저농도 주입" },
      { range: [0.50, 0.62], title: "5. 질화막/산화막 Sidewall Spacer 형성" },
      { range: [0.62, 0.74], title: "6. Source/Drain 고농도 도핑 (n+ / p+)" },
      { range: [0.74, 0.84], title: "7. Salicide 형성 (TiSi2 저항 개선)" },
      { range: [0.84, 0.93], title: "8. PMD 절연막 & 텅스텐(W) 컨택트 플러그" },
      { range: [0.93, 1.00], title: "9. Metal 배선 완성 (GND, VDD, Out 결선)" }
    ];

    function onCmosSlider(val) {
      pauseCmos();
      cmosProgress = val / 1000;
      renderCmos(cmosProgress);
    }

    function toggleCmosPlay() {
      if (isCmosPlaying) {
        pauseCmos();
      } else {
        if (cmosProgress >= 1.0) cmosProgress = 0.0;
        playCmos();
      }
    }

    function playCmos() {
      isCmosPlaying = true;
      document.getElementById("cmosPlayBtn").innerText = "⏸ 일시 정지";
      let lastTime = performance.now();

      function step(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        cmosProgress += dt * 0.065;
        if (cmosProgress > 1.0) {
          cmosProgress = 1.0;
          pauseCmos();
        }
        document.getElementById("cmosSlider").value = Math.floor(cmosProgress * 1000);
        renderCmos(cmosProgress);

        if (isCmosPlaying && cmosProgress < 1.0) {
          cmosAnimId = requestAnimationFrame(step);
        }
      }
      cmosAnimId = requestAnimationFrame(step);
    }

    function pauseCmos() {
      isCmosPlaying = false;
      document.getElementById("cmosPlayBtn").innerText = "▶ 전체 공정 연속 재생";
      if (cmosAnimId) cancelAnimationFrame(cmosAnimId);
    }

    function resetCmos() {
      pauseCmos();
      cmosProgress = 0.0;
      document.getElementById("cmosSlider").value = 0;
      renderCmos(0.0);
    }

    function renderCmos(p) {
      let curTitle = cmosStages[0].title;
      for (let st of cmosStages) {
        if (p >= st.range[0] && p <= st.range[1]) {
          curTitle = st.title;
          break;
        }
        if (p > 0.93) curTitle = cmosStages[cmosStages.length - 1].title;
      }
      document.getElementById("cmosStageBadge").innerText = `[${(p * 100).toFixed(0)}%] ${curTitle}`;

      cmosCtx.clearRect(0, 0, cmosCanvas.width, cmosCanvas.height);
      const w = cmosCanvas.width;

      cmosCtx.fillStyle = "#fef08a";
      cmosCtx.fillRect(40, 120, w - 80, 130);
      cmosCtx.fillStyle = "#854d0e";
      cmosCtx.font = "bold 11px sans-serif";
      cmosCtx.fillText("p-type Silicon Substrate", 50, 235);

      const p1 = getRangeP(p, 0.0, 0.12);
      if (p1 > 0) {
        const wellH = 85 * p1;
        cmosCtx.fillStyle = "#e2e8f0";
        cmosCtx.fillRect(40, 120, (w - 80) * 0.48, wellH);
        cmosCtx.fillStyle = "#93c5fd";
        cmosCtx.fillRect(40 + (w - 80) * 0.48, 120, (w - 80) * 0.52, wellH);

        if (wellH > 25) {
          cmosCtx.fillStyle = "#1e3a8a";
          cmosCtx.fillText("P-Well (NMOS 영역)", 140, 185);
          cmosCtx.fillText("N-Well (PMOS 영역)", w * 0.65, 185);
        }
      }

      const p2 = getRangeP(p, 0.12, 0.24);
      if (p2 > 0) {
        const stiDepth = 45 * p2;
        cmosCtx.fillStyle = "#38bdf8";
        cmosCtx.fillRect(40, 120, 60, stiDepth);
        cmosCtx.fillRect(w * 0.47, 120, 60, stiDepth);
        cmosCtx.fillRect(w - 100, 120, 60, stiDepth);
      }

      const p3 = getRangeP(p, 0.24, 0.38);
      if (p3 > 0) {
        cmosCtx.fillStyle = "#0284c7";
        cmosCtx.fillRect(w * 0.22, 116, 90, 4);
        cmosCtx.fillRect(w * 0.68, 116, 90, 4);

        const gateH = 34 * p3;
        cmosCtx.fillStyle = "#22c55e";
        cmosCtx.fillRect(w * 0.22, 116 - gateH, 90, gateH);
        cmosCtx.fillRect(w * 0.68, 116 - gateH, 90, gateH);
      }

      const p4 = getRangeP(p, 0.38, 0.50);
      if (p4 > 0) {
        cmosCtx.fillStyle = `rgba(56, 189, 248, ${0.9 * p4})`;
        cmosCtx.fillRect(w * 0.17, 120, 45, 14);
        cmosCtx.fillRect(w * 0.22 + 90, 120, 45, 14);

        cmosCtx.fillStyle = `rgba(244, 63, 94, ${0.9 * p4})`;
        cmosCtx.fillRect(w * 0.63, 120, 45, 14);
        cmosCtx.fillRect(w * 0.68 + 90, 120, 45, 14);
      }

      const p5 = getRangeP(p, 0.50, 0.62);
      if (p5 > 0) {
        const spW = 16 * p5;
        cmosCtx.fillStyle = "#cbd5e1";
        cmosCtx.fillRect(w * 0.22 - spW, 82, spW, 38);
        cmosCtx.fillRect(w * 0.22 + 90, 82, spW, 38);
        cmosCtx.fillRect(w * 0.68 - spW, 82, spW, 38);
        cmosCtx.fillRect(w * 0.68 + 90, 82, spW, 38);
      }

      const p6 = getRangeP(p, 0.62, 0.74);
      if (p6 > 0) {
        const sdH = 28 * p6;
        cmosCtx.fillStyle = "#0284c7";
        cmosCtx.fillRect(w * 0.14, 120, 45, sdH);
        cmosCtx.fillRect(w * 0.22 + 106, 120, 45, sdH);

        cmosCtx.fillStyle = "#dc2626";
        cmosCtx.fillRect(w * 0.60, 120, 45, sdH);
        cmosCtx.fillRect(w * 0.68 + 106, 120, 45, sdH);
      }

      const p7 = getRangeP(p, 0.74, 0.84);
      if (p7 > 0) {
        const salH = 6 * p7;
        cmosCtx.fillStyle = "#0f172a";
        cmosCtx.fillRect(w * 0.14, 120, 45, salH);
        cmosCtx.fillRect(w * 0.22 + 106, 120, 45, salH);
        cmosCtx.fillRect(w * 0.22, 82, 90, salH);

        cmosCtx.fillRect(w * 0.60, 120, 45, salH);
        cmosCtx.fillRect(w * 0.68 + 106, 120, 45, salH);
        cmosCtx.fillRect(w * 0.68, 82, 90, salH);
      }

      const p8 = getRangeP(p, 0.84, 0.93);
      if (p8 > 0) {
        cmosCtx.fillStyle = "rgba(148, 163, 184, 0.4)";
        cmosCtx.fillRect(40, 25, w - 80, 95);

        const plugH = 57 * p8;
        cmosCtx.fillStyle = "#f59e0b";
        cmosCtx.fillRect(w * 0.155, 82 - plugH + 38, 16, plugH);
        cmosCtx.fillRect(w * 0.22 + 120, 82 - plugH + 38, 16, plugH);
        cmosCtx.fillRect(w * 0.615, 82 - plugH + 38, 16, plugH);
        cmosCtx.fillRect(w * 0.68 + 120, 82 - plugH + 38, 16, plugH);
      }

      const p9 = getRangeP(p, 0.93, 1.00);
      if (p9 > 0) {
        const mH = 18 * p9;
        cmosCtx.fillStyle = "#f43f5e";
        cmosCtx.fillRect(w * 0.135, 25 - mH + 18, 55, mH);
        cmosCtx.fillRect(w * 0.22 + 100, 25 - mH + 18, 55, mH);
        cmosCtx.fillRect(w * 0.595, 25 - mH + 18, 55, mH);
        cmosCtx.fillRect(w * 0.68 + 100, 25 - mH + 18, 55, mH);

        if (p9 > 0.6) {
          cmosCtx.fillStyle = "#fff";
          cmosCtx.font = "bold 11px sans-serif";
          cmosCtx.fillText("GND", w * 0.15, 20);
          cmosCtx.fillText("Vout", w * 0.22 + 115, 20);
          cmosCtx.fillText("Vout", w * 0.61, 20);
          cmosCtx.fillText("VDD", w * 0.68 + 115, 20);
        }
      }
    }

    window.onload = () => {
      buildTree();
    };
  </script>
